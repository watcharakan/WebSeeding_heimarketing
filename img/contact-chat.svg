<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250">
  <!-- Contact / Chat illustration -->

  <!-- Background -->
  <circle cx="150" cy="130" r="100" fill="#E31937" opacity=".05"/>

  <!-- Phone outline -->
  <rect x="100" y="30" width="100" height="180" rx="18" fill="none" stroke="#E31937" stroke-width="3" opacity=".3"/>
  <rect x="108" y="55" width="84" height="130" rx="4" fill="#E31937" opacity=".06"/>
  <circle cx="150" cy="197" r="6" fill="none" stroke="#E31937" stroke-width="2" opacity=".3"/>
  <rect x="135" y="38" width="30" height="4" rx="2" fill="#E31937" opacity=".2"/>

  <!-- Chat bubbles on phone -->
  <!-- Incoming message -->
  <g transform="translate(115,70)">
    <rect x="0" y="0" width="55" height="22" rx="11" fill="#E31937"/>
    <text x="28" y="15" text-anchor="middle" font-size="9" fill="#fff">สนใจครับ!</text>
  </g>

  <!-- Outgoing message -->
  <g transform="translate(135,100)">
    <rect x="0" y="0" width="52" height="22" rx="11" fill="#eee"/>
    <text x="26" y="15" text-anchor="middle" font-size="9" fill="#333">ยินดีค่ะ</text>
  </g>

  <!-- Incoming -->
  <g transform="translate(115,130)">
    <rect x="0" y="0" width="65" height="22" rx="11" fill="#E31937"/>
    <text x="33" y="15" text-anchor="middle" font-size="9" fill="#fff">ราคาเท่าไหร่?</text>
  </g>

  <!-- Outgoing -->
  <g transform="translate(125,158)">
    <rect x="0" y="0" width="62" height="22" rx="11" fill="#eee"/>
    <text x="31" y="15" text-anchor="middle" font-size="9" fill="#333">1,500 บ./ด.</text>
  </g>

  <!-- Floating icons around phone -->
  <!-- LINE icon -->
  <g transform="translate(55,60)">
    <circle cx="0" cy="0" r="18" fill="#06C755"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">L</text>
  </g>

  <!-- Email icon -->
  <g transform="translate(245,80)">
    <circle cx="0" cy="0" r="16" fill="#E31937" opacity=".2"/>
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="none" stroke="#E31937" stroke-width="1.5"/>
    <path d="M-10 -7 L0 2 L10 -7" fill="none" stroke="#E31937" stroke-width="1.5"/>
  </g>

  <!-- Phone icon -->
  <g transform="translate(60,170)">
    <circle cx="0" cy="0" r="15" fill="#E31937" opacity=".15"/>
    <text x="0" y="6" text-anchor="middle" font-size="16">&#9742;</text>
  </g>

  <!-- Heart -->
  <g transform="translate(240,160)" opacity=".5">
    <path d="M0-8 C0-13 8-13 8-8 C8-3 0 5 0 5 C0 5 -8-3 -8-8 C-8-13 0-13 0-8Z" fill="#E31937" transform="scale(1.3)"/>
  </g>

  <!-- Notification bell -->
  <g transform="translate(230,190)" opacity=".4">
    <circle cx="0" cy="0" r="14" fill="#FFD700" opacity=".3"/>
    <text x="0" y="5" text-anchor="middle" font-size="14">&#128276;</text>
  </g>
</svg>
