<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <!-- Seed to Brand growth illustration -->

  <!-- Step 1: Seed -->
  <g transform="translate(60,100)">
    <circle cx="0" cy="20" r="35" fill="#E31937" opacity=".08"/>
    <ellipse cx="0" cy="35" rx="20" ry="6" fill="#8B4513" opacity=".3"/>
    <!-- Seed -->
    <ellipse cx="0" cy="20" rx="10" ry="14" fill="#E31937"/>
    <path d="M-3 12 Q0 6 3 12" fill="#ff6b7f"/>
    <!-- Small sprout -->
    <path d="M0 6 Q-2 -5 0 -10 Q2 -5 0 6" fill="#4CAF50" stroke="#388E3C" stroke-width="1"/>
    <text x="0" y="65" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">Seed</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(115,105)" opacity=".4">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#E31937" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="40,-5 50,0 40,5" fill="#E31937"/>
  </g>

  <!-- Step 2: Growing content -->
  <g transform="translate(200,100)">
    <circle cx="0" cy="10" r="40" fill="#E31937" opacity=".08"/>
    <!-- Plant growing -->
    <line x1="0" y1="40" x2="0" y2="-5" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M0 15 Q-20 5 -15 -5 Q-5 0 0 15Z" fill="#4CAF50"/>
    <path d="M0 5 Q20 -5 15 -15 Q5 -8 0 5Z" fill="#66BB6A"/>
    <!-- Content icons as flowers -->
    <circle cx="-15" cy="-12" r="8" fill="#E31937" opacity=".7"/>
    <circle cx="15" cy="-20" r="8" fill="#E31937" opacity=".8"/>
    <circle cx="0" cy="-28" r="10" fill="#E31937"/>
    <!-- Icons on flowers -->
    <text x="-15" y="-9" text-anchor="middle" font-size="9" fill="#fff">P</text>
    <text x="15" y="-17" text-anchor="middle" font-size="9" fill="#fff">f</text>
    <text x="0" y="-24" text-anchor="middle" font-size="11" fill="#fff">T</text>
    <text x="0" y="65" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">Content</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(255,105)" opacity=".4">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#E31937" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="40,-5 50,0 40,5" fill="#E31937"/>
  </g>

  <!-- Step 3: Spreading -->
  <g transform="translate(340,100)">
    <circle cx="0" cy="10" r="42" fill="#E31937" opacity=".08"/>
    <!-- Central node -->
    <circle cx="0" cy="5" r="12" fill="#E31937"/>
    <text x="0" y="9" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">S</text>
    <!-- Spreading lines -->
    <line x1="12" y1="0" x2="30" y2="-15" stroke="#E31937" stroke-width="1.5" opacity=".5"/>
    <line x1="12" y1="8" x2="32" y2="15" stroke="#E31937" stroke-width="1.5" opacity=".5"/>
    <line x1="-12" y1="0" x2="-28" y2="-18" stroke="#E31937" stroke-width="1.5" opacity=".5"/>
    <line x1="-12" y1="10" x2="-30" y2="20" stroke="#E31937" stroke-width="1.5" opacity=".5"/>
    <line x1="0" y1="-8" x2="0" y2="-28" stroke="#E31937" stroke-width="1.5" opacity=".5"/>
    <!-- Small nodes -->
    <circle cx="32" cy="-17" r="6" fill="#ff6b7f"/>
    <circle cx="34" cy="17" r="5" fill="#ff6b7f"/>
    <circle cx="-30" cy="-20" r="5" fill="#ff6b7f"/>
    <circle cx="-32" cy="22" r="6" fill="#ff6b7f"/>
    <circle cx="0" cy="-30" r="5" fill="#ff6b7f"/>
    <text x="0" y="65" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">Spread</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(397,105)" opacity=".4">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#E31937" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="40,-5 50,0 40,5" fill="#E31937"/>
  </g>

  <!-- Step 4: Results -->
  <g transform="translate(485,100)">
    <circle cx="0" cy="10" r="45" fill="#E31937" opacity=".08"/>
    <!-- Chart going up -->
    <rect x="-30" y="30" width="60" height="2" fill="#ddd"/>
    <rect x="-25" y="15" width="12" height="17" rx="2" fill="#ff6b7f"/>
    <rect x="-8" y="5" width="12" height="27" rx="2" fill="#E31937" opacity=".7"/>
    <rect x="9" y="-10" width="12" height="42" rx="2" fill="#E31937"/>
    <!-- Arrow up -->
    <path d="M-20 20 L0 0 L15 -15" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="18,-18 15,-8 10,-14" fill="#4CAF50"/>
    <!-- Star -->
    <text x="22" y="-15" font-size="14" fill="#FFD700">&#9733;</text>
    <text x="0" y="65" text-anchor="middle" font-size="11" fill="#666" font-family="sans-serif">Results</text>
  </g>
</svg>
