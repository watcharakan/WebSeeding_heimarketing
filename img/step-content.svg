<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <circle cx="40" cy="40" r="35" fill="#E31937" opacity=".08"/>
  <!-- Pen writing content -->
  <rect x="18" y="18" width="35" height="44" rx="4" fill="#fff" stroke="#E31937" stroke-width="2"/>
  <!-- Text lines -->
  <line x1="24" y1="28" x2="47" y2="28" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="35" x2="42" y2="35" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="42" x2="45" y2="42" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="49" x2="38" y2="49" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  <!-- Pen -->
  <g transform="translate(55,25) rotate(30)">
    <rect x="-3" y="0" width="6" height="30" rx="1" fill="#E31937"/>
    <polygon points="-3,30 3,30 0,38" fill="#FFD700"/>
    <rect x="-3" y="0" width="6" height="6" rx="1" fill="#c41530"/>
  </g>
  <!-- Star -->
  <text x="14" y="18" font-size="12" fill="#FFD700">&#9733;</text>
</svg>
