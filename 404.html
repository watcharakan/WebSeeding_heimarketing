<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>404 - ไม่พบหน้านี้ | Heimarketing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E31937;--dark:#111;--darker:#0a0a0a;--white:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--darker);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;line-height:1.7}
.error-code{font-size:8rem;font-weight:900;color:var(--red);line-height:1;margin-bottom:1rem;text-shadow:0 0 40px rgba(227,25,55,.3)}
h1{font-size:1.8rem;margin-bottom:1rem}
p{color:rgba(255,255,255,.7);font-size:1.1rem;margin-bottom:2rem;max-width:500px}
.btn{display:inline-block;background:var(--red);color:var(--white);padding:.8rem 2rem;border-radius:8px;text-decoration:none;font-weight:700;border:2px solid var(--red);transition:all .3s;font-size:1rem}
.btn:hover{background:#c41530;border-color:#c41530;transform:translateY(-2px)}
.horse{margin-bottom:2rem;filter:drop-shadow(0 0 30px rgba(227,25,55,.3));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.links{margin-top:2rem;display:flex;gap:2rem;flex-wrap:wrap;justify-content:center}
.links a{color:rgba(255,255,255,.5);text-decoration:none;font-size:.9rem;transition:color .3s}
.links a:hover{color:var(--red)}
</style>
</head>
<body>

<div class="error-code">404</div>
<h1>ไม่พบหน้าที่คุณต้องการ</h1>
<p>หน้านี้อาจถูกย้าย ลบ หรือ URL ไม่ถูกต้อง ลองกลับไปหน้าหลักหรือดูบริการของเรา</p>
<a href="/" class="btn">กลับหน้าหลัก</a>
<div class="links">
<a href="/#services">บริการ</a>
<a href="/#pricing">ราคา</a>

<a href="/#contact">ติดต่อเรา</a>
</div>
</body>
</html>
