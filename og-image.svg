  <rect x="750" y="285" width="370" height="80" rx="12" fill="rgba(227,25,55,0.15)" stroke="#E31937" stroke-width="2"/>
  <text x="935" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#E31937" text-anchor="middle">50+ Team</text>
  <rect x="750" y="390" width="370" height="80" rx="12" fill="rgba(227,25,55,0.15)" stroke="#E31937" stroke-width="2"/>
  <text x="935" y="440" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#E31937" text-anchor="middle">1,000+ Brands</text>
